[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iotrace"
version = "0.1.0"
description = "Offline block-IO trace analyzer: Android/Perfetto trace -> single self-contained HTML"
requires-python = ">=3.10"
dependencies = [
    "perfetto>=0.58",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "playwright"]

[project.scripts]
iotrace = "iotrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

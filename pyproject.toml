[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blkscope"
dynamic = ["version"]
description = "Offline block-IO trace analyzer: Android/Perfetto trace -> single self-contained HTML"
requires-python = ">=3.10"
dependencies = [
    "perfetto>=0.58",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "playwright"]
release = ["pyinstaller>=6.0"]

[project.scripts]
blkscope = "blkscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "blkscope.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
